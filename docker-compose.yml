name: kero-arsenal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    # ElectricSQL محتاج logical replication
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "54321:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kero"]
      interval: 2s
      timeout: 3s
      retries: 20

  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/kero?sslmode=disable
      # للـ development بس! في الـ Production لازم تأمّن الـ API (ELECTRIC_SECRET)
      ELECTRIC_INSECURE: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474" # Toxiproxy HTTP API
      - "54322:54322" # الـ Proxy اللي بيعدّي عليه Postgres في الـ Chaos Tests
    depends_on:
      postgres:
        condition: service_healthy
