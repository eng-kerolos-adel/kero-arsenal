name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome (lint + format + imports)
        run: npx biome ci .
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  chaos:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Postgres + Electric + Toxiproxy
        run: docker compose up -d --wait
      - name: Chaos tests (Toxiproxy)
        run: npm run test:chaos
      - name: Logs on failure
        if: failure()
        run: docker compose logs
